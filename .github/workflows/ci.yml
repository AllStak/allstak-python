name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Unit + integration tests across the supported Python matrix.
  # -----------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Spec requires 3.10 / 3.11 / 3.12. We keep 3.9 because
        # requires-python is >=3.9 and removing it from CI would be a
        # silent compatibility downgrade. 3.13 is added so we catch
        # forward-compat issues against the latest stable.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install dev + every framework extra so the framework integration
          # tests (Django / FastAPI / Flask / SQLAlchemy) collect and run
          # instead of erroring out on a missing optional import.
          pip install -e ".[dev,all]" || pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-cov pytest-asyncio pytest-mock respx httpx requests hatchling build

      - name: Run unit tests
        run: pytest -v --cov=src/allstak --ignore=tests/test_integration.py

  # -----------------------------------------------------------------------
  # Packaging validation — runs the same gate that publish.yml runs, but
  # on every push so packaging regressions show up immediately, not at
  # release time. This is the first-line defence for the spec's
  # "Fail build on packaging warnings" requirement.
  # -----------------------------------------------------------------------
  packaging:
    name: Packaging validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist + wheel (reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          python -m build

      - name: Twine check (strict)
        # --strict turns README rendering warnings into errors. This is
        # the standard PyPI long-description gate.
        run: python -m twine check --strict dist/*

      - name: Verify dist/ contents
        run: |
          ls -lh dist/
          test "$(ls dist/*.whl | wc -l)" = "1"
          test "$(ls dist/*.tar.gz | wc -l)" = "1"

      - name: Install from wheel + import smoke test
        run: |
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install --upgrade pip
          /tmp/install-test/bin/pip install dist/*.whl
          /tmp/install-test/bin/python -c "import allstak; print('import OK')"

      - name: Install from sdist + import smoke test
        run: |
          python -m venv /tmp/install-sdist
          /tmp/install-sdist/bin/pip install --upgrade pip
          /tmp/install-sdist/bin/pip install dist/*.tar.gz
          /tmp/install-sdist/bin/python -c "import allstak; print('sdist import OK')"

      - name: Upload built artefacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
